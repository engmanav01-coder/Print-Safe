<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <script src="register.js"></script>
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Create Account | PrivacyPrint</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body class="auth-page">


    <div class="auth-container">


        <a href="index.html" class="logo">
            Privacy<span>Print</span>
        </a>


        <div class="auth-card">

            <h1>
                Create account
            </h1>

            <p>
                Create your PrivacyPrint account.
            </p>


            <form id="registerForm">


                <label>
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Manav"
                    required
                >


                <label>
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="you@example.com"
                    required
                >


                <label>
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Minimum 6 characters"
                    minlength="6"
                    required
                >


                <button
                    type="submit"
                    class="primary-btn full-btn"
                >
                    Create Account
                </button>

            </form>


            <p id="message" class="form-message"></p>


            <div class="auth-bottom">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </div>

        </div>

    </div>


    <script src="js/register.js"></script>

</body>

</html>
