<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | PrivacyPrint</title>

    <link rel="stylesheet" href="style.css">

</head>


<body class="auth-page">


    <div class="auth-container">


        <a href="index.html" class="logo">
            Privacy<span>Print</span>
        </a>


        <div class="auth-card">


            <h1>
                Welcome back
            </h1>


            <p>
                Sign in to securely manage your print documents.
            </p>


            <!-- GOOGLE LOGIN -->

            <div
                id="g_id_onload"
                data-client_id="YOUR_GOOGLE_CLIENT_ID"
                data-callback="handleGoogleLogin"
                data-auto_prompt="false">
            </div>


            <div
                class="g_id_signin"
                data-type="standard"
                data-size="large"
                data-theme="outline"
                data-text="continue_with"
                data-shape="rectangular"
                data-logo_alignment="left">
            </div>


            <div class="divider">
                <span>OR</span>
            </div>


            <!-- NORMAL LOGIN -->

            <form id="loginForm">


                <label>
                    Email
                </label>


                <input
                    type="email"
                    id="email"
                    placeholder="you@example.com"
                    required
                >


                <label>
                    Password
                </label>


                <input
                    type="password"
                    id="password"
                    placeholder="Enter password"
                    required
                >


                <button
                    type="submit"
                    class="primary-btn full-btn"
                >
                    Login
                </button>


            </form>


            <p
                id="message"
                class="form-message">
            </p>


            <div class="auth-bottom">

                Don't have an account?

                <a href="register.html">
                    Create account
                </a>

            </div>


        </div>

    </div>


    <!-- GOOGLE IDENTITY SERVICES -->

    <script
        src="https://accounts.google.com/gsi/client"
        async
        defer>
    </script>


    <script src="login.js"></script>


</body>

</html>
